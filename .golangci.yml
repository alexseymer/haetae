version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # Tests and the Docker-driven test helper may ignore Close errors,
      # build commands from variables and skip contexts.
      - path: '_test\.go'
        linters: [errcheck, gosec, noctx]
      - path: internal/store/storetest/
        linters: [gosec, noctx]
formatters:
  enable:
    - gofmt
    - goimports
