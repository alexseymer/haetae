version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    ignore:
      # vitepress-plugin-mermaid 2.x needs mermaid 11 (peer conflict with 12)
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]
