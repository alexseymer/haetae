name: Release

# Cut a release with: git tag vX.Y.Z && git push --tags (docs/contributors/release.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push ghcr.io/alexseymer/haetae-server
  id-token: write   # keyless cosign signing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/alexseymer/haetae-server

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # make release derives the version from git describe
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Version
        id: ver
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Pre-releases (v1.0.0-rc1) do not move :latest.
          case "$version" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT" ;; *) echo "pre=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Build release artifacts
        run: make release RELEASE_VERSION="${{ steps.ver.outputs.version }}"

      - name: Verify checksums
        run: cd bin/release && sha256sum -c SHA256SUMS

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        shell: bash
        run: |
          {
            echo "list<<EOF"
            echo "${IMAGE}:${{ steps.ver.outputs.version }}"
            [ "${{ steps.ver.outputs.pre }}" = "false" ] && echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push the server image
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          push: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign the image (keyless)
        shell: bash
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          flags=""
          [ "${{ steps.ver.outputs.pre }}" = "true" ] && flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" $flags --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME" \
            bin/release/haetae-*-linux-* bin/release/SHA256SUMS
