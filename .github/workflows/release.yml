name: Release

# Cut a release with: git tag vX.Y.Z && git push --tags (docs/contributors/release.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push ghcr.io/alexseymer/haetae-server
  id-token: write   # keyless cosign signing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/alexseymer/haetae-server

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # make release derives the version from git describe
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Version
        id: ver
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Pre-releases (v1.0.0-rc1) do not move :latest.
          case "$version" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT" ;; *) echo "pre=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Build release artifacts
        run: make release RELEASE_VERSION="${{ steps.ver.outputs.version }}"

      - name: Verify checksums
        run: cd bin/release && sha256sum -c SHA256SUMS

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        shell: bash
        run: |
          {
            echo "list<<EOF"
            echo "${IMAGE}:${{ steps.ver.outputs.version }}"
            [ "${{ steps.ver.outputs.pre }}" = "false" ] && echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push the server image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          push: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image (keyless)
        shell: bash
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          flags=""
          [ "${{ steps.ver.outputs.pre }}" = "true" ] && flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" $flags --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME" \
            bin/release/haetae-*-linux-* bin/release/SHA256SUMS
