syntax = "proto3";

// Package haetae.agent.v1 is the contract between the host agent and the
// control plane's agent gateway.
//
// The agent always dials out. Enroll is the only call made without a client
// certificate; it trades a single-use token for one. Every later call is a
// single long-lived Connect stream authenticated by that certificate. The
// server sends commands down the same stream, so the host needs no inbound
// port.
package haetae.agent.v1;

option go_package = "github.com/alexseymer/haetae/internal/gen/haetae/agent/v1;agentv1";

service AgentGatewayService {
  // Enroll exchanges a single-use token and a certificate signing request
  // for a client certificate. Called once per host, without a client cert.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  // Connect is the agent's session. The first agent message must be Hello.
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
}

message EnrollRequest {
  string token = 1;
  // PKCS#10 certificate signing request, DER encoded. The server ignores
  // the subject and issues the certificate for the new host's id.
  bytes csr_der = 2;
  HostInfo host = 3;
}

message EnrollResponse {
  string host_id = 1;
  // Client certificate, DER encoded.
  bytes certificate_der = 2;
  // CA certificate that signs both the gateway and client certificates.
  bytes ca_certificate_der = 3;
}

message HostInfo {
  string hostname = 1;
  string os = 2;             // e.g. "Debian GNU/Linux 13 (trixie)"
  string kernel = 3;         // uname -r
  string arch = 4;           // GOARCH
  string docker_version = 5; // empty if Docker is unreachable
  string agent_version = 6;
}

message ConnectRequest {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    CommandResult result = 3;
    StateSnapshot state = 4;
    MetricsBatch metrics = 5;
    LogBatch logs = 6;
    DeployEvent deploy_event = 7;
    DeployLog deploy_log = 8;
    BranchUpdate branch_update = 9;
    SbomReport sbom_report = 10;
    SecurityReport security_report = 11;
    OutboundBatch outbound_batch = 12;
    ImageCandidates image_candidates = 13;
  }
}

message ConnectResponse {
  oneof msg {
    Welcome welcome = 1;
    Command command = 2;
    GreenSet green = 3;
    WatchSet watch = 4;
    Policy policy = 5;
  }
}

// Policy tells the agent the organisation's autonomy level whenever it
// changes (Welcome carries it at session start). The agent enforces it
// itself, independently of the server's own checks.
message Policy {
  string autonomy = 1; // report | suggest | act
}

message Hello {
  HostInfo host = 1;
}

message Welcome {
  // Interval at which the agent must send heartbeats. The server treats a
  // host as offline after three missed intervals.
  uint32 heartbeat_seconds = 1;
  // Organisation autonomy level: report | suggest | act. Empty means report.
  string autonomy = 2;
}

message Heartbeat {
  // Unix time in milliseconds on the agent, for clock-skew reporting.
  int64 sent_unix_ms = 1;
}

// Command is a request from the server. The agent executes only command
// kinds it knows and that its local autonomy policy allows; anything else
// is answered with an error result.
message Command {
  string id = 1;
  oneof kind {
    Ping ping = 2;
    QueryLogs query_logs = 3;
    Deploy deploy = 4;
    RemoveProject remove_project = 5;
    ScanContainer scan_container = 6;
    ScanImage scan_image = 7;
    PullImage pull_image = 8;
    RestartContainer restart_container = 10;
  }
  // How the command was authorised. UNSPECIFIED is a user-initiated command
  // (deploy API, settings); operator commands are APPROVED or AUTO.
  Authorization authorization = 9;
}

enum Authorization {
  AUTHORIZATION_UNSPECIFIED = 0;
  AUTHORIZATION_APPROVED = 1; // after a verified account pressed an approval button
  AUTHORIZATION_AUTO = 2;     // the operator acted on its own at level act
}

// RestartContainer restarts one container. It is the only operator action
// in v1; it never removes a container, an image or a volume.
message RestartContainer {
  string container_id = 1;
}

message Ping {}

// QueryLogs asks for recent log lines of one container from the agent's
// ring buffer. Lines are redacted on the host before they are returned.
message QueryLogs {
  string container_id = 1;
  int64 from_unix_ms = 2;
  int64 to_unix_ms = 3;
  uint32 max_lines = 4; // the agent caps this at 1000
}

message CommandResult {
  string command_id = 1;
  // Empty on success.
  string error = 2;
  oneof payload {
    LogLines log_lines = 3;
  }
}

message LogLines {
  repeated LogLine lines = 1;
  bool truncated = 2; // more lines matched than were returned
}

message LogLine {
  int64 ts_unix_ms = 1;
  string line = 2; // redacted
}

// StateSnapshot is the complete set of containers on the host. The agent
// sends one after connecting, after Docker events, and at least every 60 s.
// Container environment values, command lines and arbitrary labels are never
// included.
message StateSnapshot {
  int64 taken_unix_ms = 1;
  bool docker_reachable = 2;
  string docker_error = 3; // why Docker could not be read, if not reachable
  string docker_version = 4;
  repeated ContainerState containers = 5;
}

message ContainerState {
  string id = 1;
  string name = 2;
  string stack = 3;   // compose project label
  string service = 4; // compose service label
  string image = 5;
  string image_version = 6; // org.opencontainers.image.version label, if set
  string state = 7;         // running, exited, restarting, ...
  string status = 8;        // human status, e.g. "Up 3 hours (healthy)"
  string health = 9;        // healthy, unhealthy, starting, or empty
  int32 restart_count = 10;
  bool oom_killed = 11;
  int32 exit_code = 12;
  repeated PortMapping ports = 13;
  int64 created_unix_ms = 14;
  int64 started_unix_ms = 15;
}

message PortMapping {
  string ip = 1;
  uint32 private_port = 2;
  uint32 public_port = 3; // 0 when not published
  string proto = 4;
}

// MetricsBatch carries samples taken since the previous batch. Rates are per
// second and computed on the agent.
message MetricsBatch {
  repeated HostMetricSample host = 1;
  repeated ContainerMetricSample containers = 2;
}

message HostMetricSample {
  int64 ts_unix_ms = 1;
  double cpu_pct = 2;
  double load1 = 3;
  uint64 mem_total = 4;
  uint64 mem_avail = 5;
  uint64 disk_total = 6;
  uint64 disk_used = 7;
  double net_rx_bps = 8;
  double net_tx_bps = 9;
}

message ContainerMetricSample {
  string container_id = 1;
  int64 ts_unix_ms = 2;
  double cpu_pct = 3;
  uint64 mem_usage = 4;
  uint64 mem_limit = 5;
  double net_rx_bps = 6;
  double net_tx_bps = 7;
  double blk_read_bps = 8;
  double blk_write_bps = 9;
  uint32 pids = 10;
}

// LogBatch carries merged, redacted log events. A template is a line with
// numbers, ids, addresses and quoted text replaced by placeholders; lines
// with the same template inside a window are merged into one event with a
// count. Raw lines never leave the host except as the redacted sample.
message LogBatch {
  repeated LogEvent events = 1;
  // Templates first seen on this host that are not green yet: the server
  // judges them and may answer with a GreenSet.
  repeated TemplateCandidate candidates = 2;
  // Cumulative counters since the agent started, for the "95% of lines never
  // sent" measurement and for spotting dropped data.
  LogStats stats = 3;
}

message LogEvent {
  string container_id = 1;
  string template_id = 2; // 16 hex chars
  LogLevel level = 3;
  string template = 4;    // redacted
  string sample = 5;      // first raw line of the window, redacted
  uint32 count = 6;       // lines merged into this event
  int64 first_unix_ms = 7;
  int64 last_unix_ms = 8;
}

message TemplateCandidate {
  string template_id = 1;
  LogLevel level = 2;
  string template = 3; // redacted
  string sample = 4;   // redacted
}

message LogStats {
  uint64 lines_in = 1;
  uint64 lines_skipped = 2;
  uint64 events_out = 3;
  uint64 redaction_failures = 4; // batches dropped because redaction failed
  uint64 lines_dropped = 5;      // lines lost to size limits or backpressure
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_TRACE = 1;
  LOG_LEVEL_DEBUG = 2;
  LOG_LEVEL_INFO = 3;
  LOG_LEVEL_WARN = 4;
  LOG_LEVEL_ERROR = 5;
  LOG_LEVEL_FATAL = 6;
}

// GreenSet replaces the set of template ids whose lines the agent may skip.
// Only info, debug and trace templates can be green; the agent ignores the
// set for warn, error, fatal and unknown lines.
message GreenSet {
  repeated string template_ids = 1;
}

// ---- Deploys (see docs/design/m5-deploys.md) ----

// Deploy asks the agent to make a project run a version. The command result
// only acknowledges that the deploy was accepted; progress arrives as
// DeployEvent and DeployLog messages. A project has at most one deploy at a
// time; a second one is refused while the first runs.
message Deploy {
  string deploy_id = 1;
  // ^[a-z0-9][a-z0-9-]{0,39}$ ; validated again by the agent.
  string project = 2;
  oneof source {
    GitSource git = 3;
    InlineCompose inline = 4;
  }
  // Optional HTTPS ingress: the service and port that serve the domain.
  string domain = 5;
  string service = 6;
  uint32 port = 7;
  // True when this deploy restores an earlier version (manual rollback).
  bool is_rollback = 8;
  // The last version known to be healthy, used for automatic rollback when
  // this one fails to start. Empty for a first deploy.
  Version last_healthy = 9;
}

// Version identifies what runs: a Git commit (cloned by the agent) or the
// inline compose content.
message Version {
  oneof kind {
    GitSource git = 1;
    InlineCompose inline = 2;
  }
}

message GitSource {
  string url = 1;          // https:// only
  string ref = 2;          // branch name or 40-hex commit
  string compose_path = 3; // path inside the repository, default compose.yaml
  string token = 4;        // optional HTTPS access token; never logged
}

message InlineCompose {
  string content = 1;
}

// RemoveProject stops a project's containers. It never removes volumes.
message RemoveProject {
  string project = 1;
}

enum DeployPhase {
  DEPLOY_PHASE_UNSPECIFIED = 0;
  DEPLOY_PHASE_QUEUED = 1;
  DEPLOY_PHASE_FETCHING = 2;
  DEPLOY_PHASE_BUILDING = 3;
  DEPLOY_PHASE_STARTING = 4;
  DEPLOY_PHASE_CHECKING = 5;
  DEPLOY_PHASE_HEALTHY = 6;
  DEPLOY_PHASE_FAILED = 7;
  DEPLOY_PHASE_ROLLING_BACK = 8;
  DEPLOY_PHASE_ROLLED_BACK = 9;
  DEPLOY_PHASE_ROLLBACK_FAILED = 10;
}

// DeployEvent reports a phase change. Text fields are redacted on the host.
message DeployEvent {
  string deploy_id = 1;
  DeployPhase phase = 2;
  string message = 3;
  string commit = 4; // resolved commit, once known
  string url = 5;    // HTTPS address, with HEALTHY
  string error = 6;  // the failing step's raw (redacted) error, with FAILED
  int64 ts_unix_ms = 7;
}

// DeployLog is a chunk of build or start output, redacted on the host. If
// redaction of a chunk fails, it is replaced by an empty text with withheld
// set.
message DeployLog {
  string deploy_id = 1;
  uint32 seq = 2;
  string stream = 3; // "stdout" or "stderr"
  string text = 4;
  bool withheld = 5;
}

// BranchUpdate tells the server that a watched branch moved.
message BranchUpdate {
  string project = 1;
  string commit = 2;
}

// WatchSet replaces the list of branches the agent polls for auto-deploy.
message WatchSet {
  repeated WatchedBranch branches = 1;
}

message WatchedBranch {
  string project = 1;
  string url = 2;
  string ref = 3;
  string token = 4;
  string last_commit = 5; // the commit last deployed; report only newer
}

// ---- M7: inventory, misconfigurations, outbound connections, image updates ----

// ScanContainer asks the agent to inventory the image of a running container
// now (forced scan). The agent answers with an SbomReport carrying scan_id.
message ScanContainer {
  string scan_id = 1;
  string container_id = 2;
}

// ScanImage inventories an image straight from its registry without pulling
// it into the local daemon (used to evaluate a candidate update).
message ScanImage {
  string scan_id = 1;
  string ref = 2;    // repository:tag
  string digest = 3; // sha256:... pinned by the server; the agent scans ref@digest
}

// PullImage pulls ref@digest into the local daemon. It never restarts or
// replaces a container. The agent refuses when expected_digest does not match
// what the registry serves, or when the image is younger than min_age_hours
// and allow_young is false.
message PullImage {
  string ref = 1;
  string digest = 2;
  bool allow_young = 3;
  uint32 min_age_hours = 4;
}

message SbomPackage {
  string name = 1;
  string version = 2;
  string type = 3;  // deb, apk, rpm, npm, python, go-module, ...
  string purl = 4;
}

// SbomReport is the result of one inventory run. status is one of
// ok, failed, timeout, oom, unsupported. Anything but ok must carry an error
// and no packages: the server shows "scan failed", never "no vulnerabilities".
message SbomReport {
  string scan_id = 1;
  string container_id = 2; // empty for candidate scans
  string image = 3;
  string image_id = 4; // sha256 image id or digest
  string trigger = 5;  // start, deploy, daily, forced, candidate
  string status = 6;
  string error = 7;
  string tool_version = 8;
  int64 started_unix_ms = 9;
  int64 finished_unix_ms = 10;
  int64 peak_memory_bytes = 11;
  string distro_name = 12;
  string distro_version = 13;
  string distro_id_like = 14;
  repeated SbomPackage packages = 15; // at most 20000
  string source_ref = 16;             // registry ref for candidate scans
}

message Misconfig {
  string container_id = 1; // empty for host-level findings
  // published_port, docker_socket, root_user, privileged, host_network,
  // host_pid, dangerous_capability, cert_expiring
  string kind = 2;
  string severity = 3; // low, medium, high, critical
  string detail = 4;   // short, no secrets (e.g. "0.0.0.0:5432/tcp")
}

message ConntrackStatus {
  string state = 1;  // ok, degraded, unavailable
  string reason = 2; // why it is not ok
  repeated string not_monitored_container_ids = 3; // network_mode: host etc.
}

// SecurityReport is a full replacement of the host's current misconfigurations
// and monitoring state; findings absent from a later report are resolved.
message SecurityReport {
  int64 taken_unix_ms = 1;
  repeated Misconfig misconfigs = 2;
  ConntrackStatus conntrack = 3;
}

message OutboundConn {
  string container_id = 1;
  string dst_ip = 2;
  uint32 dst_port = 3;
  string proto = 4; // tcp, udp
  uint32 count = 5;
}

message OutboundBatch {
  int64 window_start_unix_ms = 1;
  int64 window_end_unix_ms = 2;
  repeated OutboundConn conns = 3; // bounded; dropped counts the rest
  uint32 dropped = 4;
}

message ImageCandidate {
  string container_id = 1;
  string image = 2;
  string running_digest = 3;
  string candidate_digest = 4;
  int64 candidate_created_unix_ms = 5;
  string status = 6; // ok, unknown (private registry), error
  string error = 7;
}

message ImageCandidates {
  repeated ImageCandidate candidates = 1;
}
